name: Release

# Triggers:
# 1. Push a tag like "v1.0.0" -> builds + creates/updates a GitHub Release with assets attached
# 2. Manual run from the Actions tab -> builds + uploads artifacts, no release created
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ----------------------------------------------------
      # 1. LINUX BUILD & PACKAGING
      # ----------------------------------------------------
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          
          # Compilation du binaire
          cargo build --release --target ${{ matrix.target }}
          
          # Garantir la présence de target/release/charist pour le PKGBUILD
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/charist" "target/release/charist"
          
          # Binaire brut
          cp "target/${{ matrix.target }}/release/charist" "staging/charist-linux-x86_64"

          # Paquet .deb
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build
          cp target/${{ matrix.target }}/debian/*.deb staging/

          # Paquet .rpm
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm staging/

          # Paquet Arch Linux via Docker (avec chown pour réattribuer les droits au runner)
          docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          archlinux:base-devel \
          bash -c "
          useradd -m builder && \
          chown -R builder:builder /workspace && \
          su builder -c 'makepkg -e -f --nodeps'
          "
          sudo chown -R "$(id -u):$(id -g)" .
          cp *.pkg.tar.zst staging/

      # ----------------------------------------------------
      # 2. MACOS BUILD & PACKAGING (.app via cargo-bundle)
      # ----------------------------------------------------
      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cargo install cargo-bundle --locked
          
          cargo bundle --release --target ${{ matrix.target }} --format osx
          
          cp "target/${{ matrix.target }}/release/charist" "staging/charist-macos-${{ matrix.target }}"
          
          APP_PATH="target/${{ matrix.target }}/release/bundle/osx/Charist.app"
          hdiutil create -volname "Charist" -srcfolder "$APP_PATH" -ov -format UDZO \
            "staging/Charist-macos-${{ matrix.target }}.dmg"

      # ----------------------------------------------------
      # 3. WINDOWS BUILD & PACKAGING (NSIS via cargo-bundle format exe)
      # ----------------------------------------------------
      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }} --format msi
          
          cp "target/${{ matrix.target }}/release/charist.exe" "staging/charist-windows-x86_64.exe"
          
          MSI_PATH=$(find "target/${{ matrix.target }}/release/bundle/msi" -name "*.msi" | head -n1)
          cp "$MSI_PATH" "staging/Charist-Setup-x86_64.msi"

      # ----------------------------------------------------
      # 4. UPLOAD ARTIFACTS
      # ----------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.target }}
          path: staging/*

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          generate_release_notes: true